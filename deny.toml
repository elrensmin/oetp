[advisories]
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSD-2-Clause",
    "ISC",
    "Unicode-3.0",
    "CC0-1.0",
    "Zlib",
    "OpenSSL",
]
deny = [
    "GPL-2.0",
    "GPL-3.0",
    "AGPL-3.0",
    "LGPL-3.0",
]
unlicensed = "deny"

[bans]
multiple-versions = "deny"
skip = [
    { name = "tower", version = "0.4" },
    { name = "tower-http", version = "0.5" },
    { name = "crypto-common", version = "0.1" },
    { name = "getrandom", version = "0.2" },
]
skip-tree = []

[sources]
allow-git = []
